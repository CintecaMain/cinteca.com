# Shared settings of the location that sends the contact forms to the platform function (nginx.conf).
# The function URL is a variable (resolved at request time by the resolver in /tmp/function-routes.conf): the
# function's gateway, http://<function id>.internal on the environment's network, or an https URL.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
# Never send a POST twice (a message would be mailed twice): no retry on another address.
proxy_next_upstream off;
proxy_connect_timeout 10s;
proxy_send_timeout 30s;
# An https function URL: SNI and a verified certificate.
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

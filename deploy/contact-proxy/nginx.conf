# The public front of the platform function CintecaContact (functions/contact-form) on the self-hosted platform
# (MainServer, environment General): the contact forms of cinteca.es and adrianocaldas.com post to this container's
# hostname, https://<hostname>.<General's primary domain>/, and nginx sends each call to the function's internal
# gateway (http://<function id>.internal, CINTECA_CONTACT_FUNCTION_URL). The function's external access stays off.
#
# Why a proxy (README.md in this folder): every server's function runner admits a fixed number of calls at once (32,
# one counter for all environments' functions on that server) and starts a container for every call, OPTIONS and GET
# included. A public function with nothing in front lets one flood fill those slots on all three servers at once and
# block the other functions (LeadBIOS, WebsiteContact, the Meta webhook, other environments' functions). Here a visitor
# gets a few calls, each server's instance passes a few calls a minute and at most 4 at once, and every other request
# is answered by nginx without a container. One instance per server (continuous, maximum 1), each calling its own
# server's gateway: any one server down leaves the others serving.
# The function answers CORS and checks the Origin itself; nginx adds no CORS header. An answer nginx gives itself
# (429, 503) has none either: the browser sees a failed request and the forms show their error message.
# TLS ends in the platform's Traefik, which forwards to port 8080.

# A fixed number: "auto" counts the host's CPUs, not the container's limit.
worker_processes 1;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The resolver and the function URL ($fn_contact), written at start by function-routes.sh.
    include /tmp/function-routes.conf;

    default_type application/json;

    # The visitor's address: Traefik reaches the container from the platform's private networks and writes the
    # visitor's address into X-Forwarded-For (it drops any value the visitor sent).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Per visitor: a submission is a preflight (OPTIONS; the browser keeps its answer 600 s) and a POST. 6 at once,
    # then 2 a minute. The AWS Lambda had no limit at all.
    limit_req_zone $binary_remote_addr zone=contact_visitor:1m rate=2r/m;
    # Per server (this instance), all visitors together: 10 a minute, 10 at once. A flood from many addresses then
    # costs at most this many function containers a minute on each server, whatever the number of attackers.
    limit_req_zone $server_name zone=contact_server:64k rate=10r/m;
    # Per server: at most 4 calls in flight to the function, of the runner's 32 slots.
    limit_conn_zone $server_name zone=contact_inflight:64k;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_origin" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    server_tokens off;
    keepalive_timeout 30;
    client_header_timeout 10s;
    client_body_timeout 10s;

    server {
        listen 8080 default_server;
        # The per-server zones' key: one name for every request this instance serves.
        server_name cinteca-contact;
        absolute_redirect off;

        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        # The image's HEALTHCHECK.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The forms: POST / (and its preflight) -> CintecaContact. The visitor's path never reaches the function's
        # gateway (always "/"), so no other path of the environment's functions can be called through here.
        location = / {
            limit_except POST OPTIONS { deny all; }
            limit_req zone=contact_visitor burst=6 nodelay;
            limit_req zone=contact_server burst=10 nodelay;
            limit_conn contact_inflight 4;
            error_page 429 = @rate_limited;
            # The function refuses more than 32 KiB with its own 413 (JSON, CORS); nginx only stops the absurd.
            client_max_body_size 64k;
            if ($fn_contact = "") {
                return 503 '{"ok":false,"message":"Contact service temporarily unavailable."}\n';
            }
            rewrite ^ / break;
            proxy_pass $fn_contact;
            include /etc/nginx/function-proxy.conf;
            # The visitor's address for Turnstile (the function reads it only from a private caller such as this one);
            # any X-Real-IP the visitor sent is replaced.
            proxy_set_header X-Real-IP $remote_addr;
            # The function sends these two as well; the server's copies above are kept, not doubled.
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            # The function's time limit is 60 s.
            proxy_read_timeout 70s;
        }

        location @rate_limited {
            # (an add_header here replaces the server's: they are repeated)
            add_header Retry-After 60 always;
            add_header Cache-Control "no-store" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 429 '{"ok":false,"message":"Too many attempts. Please try again in a few minutes."}\n';
        }

        # Anything else: answered here, no function call.
        location / {
            return 404 '{"ok":false,"message":"Not found."}\n';
        }
    }
}

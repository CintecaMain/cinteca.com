# Security headers of every answer (included at server level in nginx.conf; "always" adds them to errors too).
# HSTS for one year on this host only (no includeSubDomains or preload, as the platform's own names), sent over the
# HTTPS that Traefik terminates. The CSP allows no script, no frame, no form and no request to another origin: only
# this site's stylesheet and icon.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

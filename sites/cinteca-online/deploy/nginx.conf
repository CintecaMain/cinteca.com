# nginx for the cinteca.online identity page (www.cinteca.online), the image's main configuration (see ../Dockerfile).
# Static files only: English at /, Spanish at /es/, Portuguese at /pt/. TLS ends in the platform's Traefik, which
# forwards to port 8080. The response headers are set once at server level (security-headers.conf and Cache-Control);
# no location sets its own, so every answer, errors included, carries them.

# Two workers, not "auto", which counts the host's CPUs rather than the container's limit.
worker_processes 2;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # The image runs as uid 101 with no write access outside /tmp.
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    # text/html always gets the charset; these too.
    charset_types text/css text/plain image/svg+xml;

    # The client's address arrives in X-Forwarded-For (Traefik); access logs go to the container's stdout.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css image/svg+xml;

    # Pages are revalidated on every visit; the stylesheet and icon are cached for an hour.
    map $uri $cache_control {
        default   "public, max-age=3600";
        ~/$       "no-cache";
        ~\.html$  "no-cache";
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Behind Traefik (HTTPS on 443): redirects keep the browser's scheme and host.
        absolute_redirect off;

        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $cache_control always;

        error_page 404 /404.html;
        # A missing path is a 404 in the access log, not an error line (scanners ask for many).
        log_not_found off;

        # The image's HEALTHCHECK.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Browsers ask for it on their own; the pages name /favicon.svg.
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        # English is the root page.
        location ~ ^/en/?$ {
            return 301 /;
        }

        # Served only as the answer to a missing path.
        location = /404.html {
            internal;
        }

        # Files as they are; a directory without its trailing slash is redirected to it (/es -> /es/).
        location / {
        }
    }
}

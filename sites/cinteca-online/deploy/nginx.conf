# nginx for the cinteca.online identity page (www.cinteca.online), the image's main configuration (see ../Dockerfile).
# Static files only: English at /, Spanish at /es/, Portuguese at /pt/; the privacy policy at /privacy/,
# /es/privacidad/ and /pt/privacidade/. TLS ends in the platform's Traefik, which
# forwards both entry points (80 and 443) to port 8080 and sets X-Forwarded-Proto to the scheme the client used
# (it replaces any value the client sent: the platform trusts no forwarded headers). Plain HTTP through Traefik is
# redirected to HTTPS, except /healthz; a request without the header (the image's HEALTHCHECK on 127.0.0.1, a local
# test) is answered as it is. The response headers are set once at server level (security-headers.conf and
# Cache-Control); no location sets its own, so every answer, errors and redirects included, carries them.

# Two workers, not "auto", which counts the host's CPUs rather than the container's limit.
worker_processes 2;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # nginx runs as uid 101 and writes only in /tmp (its pid file and these temporary folders); the configuration
    # and the pages are root's and read-only (../Dockerfile).
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    # text/html always gets the charset; these too.
    charset_types text/css text/plain image/svg+xml;

    # The client's address arrives in X-Forwarded-For (Traefik); access logs go to the container's stdout.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css image/svg+xml;

    # Plain HTTP through Traefik (X-Forwarded-Proto "http") is redirected to HTTPS, every path but /healthz.
    map $http_x_forwarded_proto $https_redirect {
        default  0;
        http     $https_redirect_path;
    }
    map $uri $https_redirect_path {
        default   1;
        /healthz  0;
    }

    # HSTS only on answers that went out over HTTPS (a browser ignores it over plain HTTP).
    map $http_x_forwarded_proto $hsts {
        default  "";
        https    "max-age=31536000";
    }

    # Pages are revalidated on every visit; the stylesheet and icon are cached for an hour. Every redirect (HTTP to
    # HTTPS, /es -> /es/, /pt -> /pt/, /en and /en/ -> /, the privacy policy's folders without their slash) is
    # revalidated like the pages.
    map $https_redirect $cache_control {
        1        "no-cache";
        default  $cache_control_path;
    }
    map $uri $cache_control_path {
        default   "public, max-age=3600";
        # The health check's answer is never stored by a cache.
        /healthz  "no-store";
        /en       "no-cache";
        /es       "no-cache";
        /pt       "no-cache";
        /privacy          "no-cache";
        /es/privacidad    "no-cache";
        /pt/privacidade   "no-cache";
        ~/$       "no-cache";
        ~\.html$  "no-cache";
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Behind Traefik: the redirects inside the site (/es -> /es/, /en/ -> /) are relative, so they keep the
        # browser's scheme and host.
        absolute_redirect off;

        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $cache_control always;

        # HTTP -> HTTPS (permanent; same host, path and query), before any location.
        if ($https_redirect) {
            return 301 https://$host$request_uri;
        }

        error_page 404 /404.html;
        # A missing path is a 404 in the access log, not an error line (scanners ask for many).
        log_not_found off;

        # The image's HEALTHCHECK (wget on 127.0.0.1 inside the container; the platform routes an instance only while
        # it passes). Never redirected, also over plain HTTP through Traefik.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Browsers ask for it on their own; the pages name /favicon.svg.
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        # English is the root page.
        location ~ ^/en/?$ {
            return 301 /;
        }

        # Served only as the answer to a missing path.
        location = /404.html {
            internal;
        }

        # Files as they are; a directory without its trailing slash is redirected to it (/es -> /es/).
        location / {
        }
    }
}
